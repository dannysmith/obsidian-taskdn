name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write # For the build attestation
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4 # Keep in sync with check.yml

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

      - name: Create plugin zip
        run: zip -j obsidian-taskdn.zip main.js manifest.json styles.css

      # Proves the release files were built by this workflow. The Obsidian
      # community directory checks for it.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            main.js
            manifest.json
            styles.css
            obsidian-taskdn.zip
